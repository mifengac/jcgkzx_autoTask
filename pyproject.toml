[project]
name = "jcgkzx-autotask"
version = "0.1.0"
description = "Backend API for script-driven alert tasks"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25.1",
    "psycopg2-binary>=2.8.6",
    "oracledb>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.6.1",
    "python-multipart>=0.0.18",
    "apscheduler>=3.10.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
