<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>市局基础管控中心</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">市局基础管控中心</p>
        <h1>脚本上传与短信规则控制台</h1>
        <p class="hero-copy">离线单页前端，直接管理脚本版本、短信模板、任务频率、发送规则和运行记录。</p>
      </div>
      <div class="hero-actions">
        <div id="health-pill" class="pill pill-muted">检查中</div>
        <button id="refresh-all" class="button button-secondary" type="button">刷新全部</button>
      </div>
    </header>

    <main class="grid">
      <section class="panel panel-span-2">
        <div class="panel-head">
          <h2>运行概览</h2>
          <p id="summary-text">正在加载</p>
        </div>
        <div class="summary-grid">
          <article class="stat-card">
            <span>脚本</span>
            <strong id="stat-scripts">0</strong>
          </article>
          <article class="stat-card">
            <span>模板</span>
            <strong id="stat-templates">0</strong>
          </article>
          <article class="stat-card">
            <span>任务</span>
            <strong id="stat-tasks">0</strong>
          </article>
          <article class="stat-card">
            <span>最近运行</span>
            <strong id="stat-runs">0</strong>
          </article>
        </div>
        <pre id="flash" class="flash">系统就绪</pre>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>上传脚本</h2>
          <p>ZIP 根目录需包含 <code>manifest.json</code></p>
        </div>
        <form id="script-form" class="form-stack">
          <input name="script_name" type="text" placeholder="脚本名称" required>
          <input name="script_code" type="text" placeholder="脚本编码，如 monitor_minor" required>
          <div class="inline-fields">
            <input name="version_no" type="text" placeholder="版本号，如 1.0.0" required>
            <input name="entry_file" type="text" placeholder="入口文件，可留空">
          </div>
          <div class="inline-fields">
            <input name="entry_func" type="text" placeholder="入口函数，默认 run">
            <input name="change_log" type="text" placeholder="变更说明">
          </div>
          <input name="package" type="file" accept=".zip" required>
          <button class="button" type="submit">上传脚本</button>
        </form>
        <div id="script-list" class="list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>短信模板</h2>
          <p>模板变量使用 <code>{字段名}</code></p>
        </div>
        <form id="template-form" class="form-stack">
          <input name="template_name" type="text" placeholder="模板名称" required>
          <input name="template_code" type="text" placeholder="模板编码" required>
          <textarea name="template_content" rows="5" placeholder="模板内容" required></textarea>
          <textarea name="render_example" rows="3" placeholder="示例说明，可选"></textarea>
          <label class="checkbox">
            <input name="enabled" type="checkbox" checked>
            <span>启用模板</span>
          </label>
          <div class="inline-actions">
            <button class="button" type="submit">保存模板</button>
            <button id="template-reset" class="button button-secondary" type="button">清空</button>
          </div>
        </form>
        <div id="template-list" class="list"></div>
      </section>

      <section class="panel panel-span-2">
        <div class="panel-head">
          <h2>任务与频率</h2>
          <p>支持分钟 / 小时频率，任务运行参数以 JSON 配置</p>
        </div>
        <div id="task-current" class="banner">当前未选中任务</div>
        <form id="task-form" class="form-stack">
          <input name="task_name" type="text" placeholder="任务名称" required>
          <div class="inline-fields">
            <select id="task-script-id" name="script_id" required></select>
            <select id="task-script-version-id" name="script_version_id" required></select>
            <select id="task-template-id" name="message_template_id"></select>
          </div>
          <div class="inline-fields inline-fields-compact">
            <input name="dedup_window_minutes" type="number" min="0" value="720" placeholder="去重分钟数">
            <input name="schedule_interval_value" type="number" min="1" value="20" placeholder="频率值">
            <select name="schedule_interval_unit">
              <option value="minute">分钟</option>
              <option value="hour">小时</option>
            </select>
          </div>
          <input name="dedup_key_expr" type="text" placeholder="去重表达式，可选，例如 case_no + mobile">
          <textarea name="runtime_config" rows="5" placeholder='运行配置 JSON，如 {"sms_business_name":"治安基础管控中心","sms_userport":"0006"}'>{}</textarea>
          <label class="checkbox">
            <input name="enabled" type="checkbox" checked>
            <span>启用任务</span>
          </label>
          <div class="inline-actions">
            <button class="button" type="submit">保存任务</button>
            <button id="task-reset" class="button button-secondary" type="button">新建任务</button>
            <button id="task-run-dry" class="button button-ghost" type="button">手动演练</button>
            <button id="task-run-live" class="button button-danger" type="button">立即发送</button>
          </div>
        </form>
        <div id="task-list" class="list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>发送规则</h2>
          <p>规则绑定当前选中任务</p>
        </div>
        <form id="rule-form" class="form-stack">
          <input name="rule_name" type="text" placeholder="规则名称" required>
          <select name="rule_type" id="rule-type" required>
            <option value="fixed_receivers">固定人员</option>
            <option value="field_match">字段直接匹配</option>
            <option value="field_match_with_ancestors">字段匹配并带上级单位</option>
          </select>
          <div class="inline-fields">
            <input name="source_field" type="text" placeholder="源字段名，如 dwdm">
            <select name="target_match_field">
              <option value="sspcsdm">sspcsdm</option>
              <option value="xqdm">xqdm</option>
              <option value="county_code">county_code</option>
              <option value="city_code">city_code</option>
            </select>
          </div>
          <div class="inline-fields inline-fields-compact">
            <input name="priority" type="number" value="100" placeholder="优先级">
            <input name="target_mobile_field" type="text" value="mobile" placeholder="手机号字段">
          </div>
          <textarea name="fixed_receivers" rows="3" placeholder="固定手机号，逗号或换行分隔"></textarea>
          <textarea name="filter_json" rows="3" placeholder='联系人过滤 JSON，如 {"rwzt":"在岗"}'>{}</textarea>
          <div class="checkbox-grid">
            <label class="checkbox"><input name="enabled" type="checkbox" checked><span>启用</span></label>
            <label class="checkbox"><input name="include_self" type="checkbox" checked><span>本级</span></label>
            <label class="checkbox"><input name="include_county" type="checkbox"><span>县级</span></label>
            <label class="checkbox"><input name="include_city" type="checkbox"><span>市级</span></label>
          </div>
          <div class="inline-actions">
            <button class="button" type="submit">保存规则</button>
            <button id="rule-reset" class="button button-secondary" type="button">清空</button>
          </div>
        </form>
        <div id="rule-list" class="list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>联系人与运行记录</h2>
          <p>快速验证 `org_contact` 与最近执行结果</p>
        </div>
        <form id="contact-form" class="form-stack">
          <input name="keyword" type="text" placeholder="姓名 / 县区 / 派出所">
          <div class="inline-fields">
            <input name="sspcsdm" type="text" placeholder="sspcsdm">
            <input name="xqdm" type="text" placeholder="xqdm">
          </div>
          <button class="button button-secondary" type="submit">查询联系人</button>
        </form>
        <div id="contact-list" class="list compact-list"></div>
        <div id="run-list" class="list"></div>
      </section>
    </main>
  </div>

  <script src="/assets/app.js" defer></script>
</body>
</html>
