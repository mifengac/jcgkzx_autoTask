<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基础管控中心短信监测配置平台</title>
  <link rel="stylesheet" href="/assets/pico.min.css">
  <style>
    .app-shell {
      display: grid;
      grid-template-columns: fit-content(18rem) minmax(0, 1fr);
      gap: var(--pico-spacing);
      align-items: start;
    }

    .app-sidebar {
      width: fit-content;
      min-width: 0;
    }

    .app-sidebar > article {
      width: fit-content;
      max-width: 18rem;
      margin-bottom: 0;
    }

    #secondary-nav {
      width: fit-content;
      max-width: 100%;
    }

    #secondary-nav ul {
      display: grid;
      gap: calc(var(--pico-spacing) * 0.5);
      margin: 0;
      padding: 0;
    }

    #secondary-nav li {
      min-width: 0;
      list-style: none;
    }

    #secondary-nav button {
      width: 100%;
      margin: 0;
      white-space: nowrap;
    }

    .app-main {
      min-width: 0;
    }

    @media (max-width: 960px) {
      .app-shell {
        grid-template-columns: minmax(0, 1fr);
      }

      .app-sidebar,
      .app-sidebar > article,
      #secondary-nav {
        width: 100%;
        max-width: none;
      }
    }

    /* ---------- Health status pill ---------- */
    #health-pill {
      display: inline-block;
      padding: 0.15rem 0.65rem;
      border-radius: 999px;
      font-size: 0.85rem;
      transition: background 200ms ease;
    }
    #health-pill[data-state="ok"]       { color: #0d6b57; background: rgba(13,107,87,0.12); }
    #health-pill[data-state="bad"]      { color: #a73c2c; background: rgba(167,60,44,0.12); }
    #health-pill[data-state="checking"] { opacity: 0.6; }

    /* ---------- Flash toast ---------- */
    #flash {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 9999;
      max-width: 28rem;
    }
    #flash article {
      margin: 0;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }

    /* ---------- Detail drawer ---------- */
    #detail-drawer {
      max-width: min(92vw, 860px);
      width: 860px;
    }
    #detail-drawer > article {
      max-height: 90vh;
      overflow-y: auto;
    }

    /* ---------- Primary nav wrapping ---------- */
    #primary-nav ul {
      flex-wrap: wrap;
      gap: 0.25rem;
    }

    /* ---------- Data-card layout helpers ---------- */
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .card-head h4 { margin-bottom: 0.25rem; }

    .card-meta {
      margin-bottom: 0.75rem;
      color: var(--pico-muted-color);
      line-height: 1.7;
      font-size: 0.9rem;
    }

    /* ---------- Responsive table overflow ---------- */
    figure {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body>
  <main class="container-fluid">
    <article>
      <header>
        <p><small>JCGKZX AUTOTASK</small></p>
        <h1>基础管控中心短信监测配置平台</h1>
        <p>统一查看任务、主题、短信与运行记录。</p>
      </header>
      <nav aria-label="global actions">
        <ul>
          <li><strong id="health-pill">检查中</strong></li>
        </ul>
        <ul>
          <li><button id="refresh-all" class="secondary" type="button">刷新全部</button></li>
          <li><a href="/logout" role="button" class="outline">退出登录</a></li>
        </ul>
      </nav>
    </article>

    <article>
      <nav id="primary-nav" aria-label="一级导航"></nav>
    </article>

    <div class="app-shell">
      <aside class="app-sidebar">
        <article>
          <header>
            <p><small>模块导航</small></p>
            <strong id="secondary-title">总览</strong>
          </header>
          <nav id="secondary-nav" aria-label="二级导航"></nav>
        </article>
      </aside>

      <section class="app-main">
        <article id="section-header"></article>
        <div id="content-area"></div>
      </section>
    </div>

    <section id="flash" hidden role="status" aria-live="polite"></section>
  </main>

  <dialog id="detail-drawer">
    <article>
      <header>
        <div>
          <p><small id="drawer-eyebrow">详情</small></p>
          <h2 id="drawer-title">详情面板</h2>
        </div>
        <button id="drawer-close" type="button" class="secondary" aria-label="关闭详情">Close</button>
      </header>
      <div id="drawer-body"></div>
    </article>
  </dialog>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
