<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基础管控中心短信监测配置平台</title>
  <link rel="stylesheet" href="/assets/pico.min.css">
  <link rel="stylesheet" href="/assets/console-theme.css">
</head>
<body class="console-body">
  <main class="console-app">
    <section class="surface-card surface-card--hero console-masthead">
      <div class="console-masthead__copy">
        <p class="console-eyebrow">JCGKZX AUTOTASK</p>
        <h1>基础管控中心短信监测配置平台</h1>
        <p class="console-lead">用更清晰的章节感和更稳定的状态视图，统一查看任务、主题、短信与运行记录。</p>
        <div class="console-masthead__badges" aria-label="平台能力">
          <span class="console-tag">主题监测</span>
          <span class="console-tag">脚本任务</span>
          <span class="console-tag">短信发送</span>
          <span class="console-tag">运行追踪</span>
        </div>
      </div>

      <div class="console-masthead__ops">
        <section class="console-status-card" aria-label="平台状态">
          <p class="console-eyebrow">System Pulse</p>
          <div class="console-action-group">
            <strong id="health-pill" data-state="checking">检查中</strong>
          </div>
          <p>保留现有调度、筛选与发送链路，只重做控制台的视觉节奏与信息层级。</p>
        </section>

        <div class="console-action-group" aria-label="全局操作">
          <button id="refresh-all" class="secondary" type="button">刷新全部</button>
          <a href="/logout" role="button" class="outline">退出登录</a>
        </div>
      </div>
    </section>

    <div class="console-layout">
      <aside class="console-sidebar">
        <article class="surface-card console-sidebar__card">
          <header class="console-sidebar__header">
            <p class="console-eyebrow">Primary Navigation</p>
            <h2 class="console-sidebar__title">控制台章节</h2>
          </header>
          <nav id="primary-nav" aria-label="一级导航"></nav>
        </article>

        <article class="surface-card console-sidebar__card">
          <header class="console-sidebar__header">
            <p class="console-eyebrow">Section Focus</p>
            <h2 class="console-sidebar__title" id="secondary-title">总览</h2>
          </header>
          <nav id="secondary-nav" aria-label="二级导航"></nav>
        </article>

        <article class="surface-card surface-card--dark console-sidebar__note">
          <p class="console-eyebrow">Template Preview</p>
          <h3>首版模板先服务总览页。</h3>
          <p>本轮统一壳层、卡片、表格、抽屉和状态样式，其他业务页后续按同一模板逐步迁移。</p>
        </article>
      </aside>

      <section class="console-stage">
        <article id="section-header" class="surface-card console-section-card"></article>
        <div id="content-area" class="console-content"></div>
      </section>
    </div>

    <section id="flash" hidden role="status" aria-live="polite"></section>
  </main>

  <dialog id="detail-drawer" class="console-drawer">
    <article class="console-drawer__surface">
      <header class="console-drawer__header">
        <div>
          <p class="console-eyebrow" id="drawer-eyebrow">详情</p>
          <h2 id="drawer-title">详情面板</h2>
        </div>
        <button id="drawer-close" type="button" class="secondary" aria-label="关闭详情">关闭</button>
      </header>
      <div class="console-drawer__body" id="drawer-body"></div>
    </article>
  </dialog>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
