<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>基础管控中心 · 短信监测配置平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:13px;color:#1d2129;background:#f2f3f5;line-height:1.57;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#c9cdd4;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#86909c}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── Login ─────────────────────────────────────── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#ecedf0}
.login-box{width:356px;background:#fff;border:1px solid #e5e6eb;border-radius:6px;padding:36px 28px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo-icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:#2b5797;border-radius:8px;margin-bottom:12px}
.login-title{font-size:17px;font-weight:600;color:#1d2129}
.login-sub{font-size:12px;color:#86909c;margin-top:3px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;color:#4e5969;margin-bottom:5px}
.form-row input{width:100%;height:34px;padding:0 10px;border:1px solid #e5e6eb;border-radius:4px;outline:none;font-size:13px}
.form-row input:focus{border-color:#2b5797;box-shadow:0 0 0 2px rgba(43,87,151,.1)}
.login-err{margin-bottom:12px;padding:6px 10px;background:#faeae9;border:1px solid #e8c5c3;border-radius:4px;color:#c45a52;font-size:12px}
.btn-login{width:100%;height:34px;background:#2b5797;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px;font-weight:500}
.btn-login:hover{background:#1d3f6e}
.login-tip{text-align:center;margin-top:14px;font-size:11px;color:#c9cdd4}

/* ── App Shell ──────────────────────────────────── */
.app-wrap{display:flex;flex-direction:column;height:100vh;overflow:hidden}
header.topbar{height:48px;background:#2b5797;display:flex;align-items:center;padding:0 16px;flex-shrink:0;z-index:100}
.topbar-brand{display:flex;align-items:center;gap:8px;color:#fff;font-size:14px;font-weight:500;letter-spacing:.3px}
.topbar-fill{flex:1}
.topbar-status{display:flex;align-items:center;gap:14px;margin-right:16px}
.svc-dot{display:flex;align-items:center;gap:4px;color:rgba(255,255,255,.7);font-size:11px}
.dot{width:6px;height:6px;border-radius:50%}
.topbar-div{width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 6px}
.tbtn{display:flex;align-items:center;gap:4px;height:30px;padding:0 10px;background:rgba(255,255,255,.1);border:none;border-radius:4px;cursor:pointer;color:rgba(255,255,255,.85);font-size:12px}
.tbtn:hover{background:rgba(255,255,255,.2)}
.tbtn-icon{width:30px;padding:0}

/* ── Layout ─────────────────────────────────────── */
.app-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:184px;background:#fff;border-right:1px solid #e5e6eb;padding:6px 0;overflow-y:auto;flex-shrink:0}
.nav-item{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;margin:1px 6px;border-radius:4px;cursor:pointer;font-size:13px;color:#4e5969}
.nav-item:hover{background:#f7f8fa}
.nav-item.active{background:#edf1f7;color:#2b5797;font-weight:500}
.nav-item svg{flex-shrink:0}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#f2f3f5}

/* ── Page Header ────────────────────────────────── */
.page-hdr{padding:14px 20px 0;background:#fff;border-bottom:1px solid #e5e6eb;flex-shrink:0}
.page-hdr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.page-title{font-size:15px;font-weight:600;color:#1d2129}
.page-desc{font-size:12px;color:#86909c;margin-top:2px}
.tabs{display:flex;margin-top:2px}
.tab{padding:6px 14px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:#4e5969;margin-bottom:-1px}
.tab:hover{color:#2b5797}
.tab.active{border-color:#2b5797;color:#2b5797;font-weight:500}

/* ── Page Body ──────────────────────────────────── */
.page-body{flex:1;overflow-y:auto;padding:14px 20px 20px}

/* ── Metric Cards ───────────────────────────────── */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.metric-card{background:#fff;border:1px solid #e5e6eb;border-radius:6px;padding:14px 16px}
.metric-label{font-size:12px;color:#86909c;margin-bottom:6px}
.metric-val{font-size:24px;font-weight:600;line-height:1.2}
.metric-sub{font-size:11px;color:#b0b5bd;margin-top:4px}
.grid-2{display:grid;grid-template-columns:1fr 320px;gap:12px}
.right-col{display:flex;flex-direction:column;gap:12px}

/* ── Cards ──────────────────────────────────────── */
.card{background:#fff;border:1px solid #e5e6eb;border-radius:6px;overflow:hidden}
.card-hdr{padding:10px 16px;border-bottom:1px solid #f2f3f5;font-size:13px;font-weight:600;color:#1d2129;display:flex;align-items:center;justify-content:space-between}
.card-body{padding:14px 16px}
.card-link{font-size:12px;color:#2b5797;font-weight:400;cursor:pointer}
.card-link:hover{opacity:.7}
.svc-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f2f3f5;font-size:12px;color:#4e5969}
.svc-row:last-child{border-bottom:none}
.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shortcut{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid #e5e6eb;border-radius:4px;cursor:pointer;font-size:12px;color:#4e5969}
.shortcut:hover{border-color:#2b5797;color:#2b5797}

/* ── Toolbar ────────────────────────────────────── */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.search-wrap{position:relative}
.search-wrap input{width:220px;height:30px;padding:0 8px 0 28px;border:1px solid #e5e6eb;border-radius:4px;outline:none;font-size:12px}
.search-wrap input:focus{border-color:#2b5797}
.search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#86909c;pointer-events:none}
.total-info{font-size:12px;color:#86909c}

/* ── Buttons ────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:4px;cursor:pointer;font-size:13px;border:none}
.btn-primary{background:#2b5797;color:#fff}
.btn-primary:hover{background:#1d3f6e}
.btn-default{background:#fff;border:1px solid #e5e6eb;color:#4e5969}
.btn-default:hover{border-color:#2b5797;color:#2b5797}
.btn-sm{height:26px;padding:0 10px;font-size:12px}

/* ── Table ──────────────────────────────────────── */
.table-wrap{background:#fff;border:1px solid #e5e6eb;border-radius:6px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead tr{background:#fafbfc}
th{padding:8px 12px;text-align:left;font-size:12px;font-weight:500;color:#86909c;border-bottom:1px solid #e5e6eb;white-space:nowrap;overflow:hidden}
td{padding:0 12px;height:38px;border-bottom:1px solid #f2f3f5;font-size:12px;color:#1d2129;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover{background:#f7f8fa}
.act-cell{display:flex;align-items:center;gap:10px;height:38px}
.act-link{font-size:12px;cursor:pointer;white-space:nowrap}
.act-link:hover{opacity:.7}
.empty-state{padding:48px 0;text-align:center;color:#c9cdd4;font-size:13px}
.empty-icon{font-size:32px;margin-bottom:8px;opacity:.5}

/* ── Pagination ─────────────────────────────────── */
.pagination{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:12px;font-size:12px;color:#4e5969}
.pg-info{margin-right:8px}
.pg-btn{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;background:#fff;border:1px solid #e5e6eb;border-radius:4px;cursor:pointer;font-size:12px;color:#4e5969}
.pg-btn:hover{border-color:#2b5797;color:#2b5797}
.pg-btn.active{background:#2b5797;border-color:#2b5797;color:#fff}

/* ── Badge ──────────────────────────────────────── */
.badge{display:inline-block;padding:1px 8px;font-size:12px;line-height:20px;border-radius:3px;white-space:nowrap}
.badge-green{background:#edf5ef;color:#3c7d0e;border:1px solid #c8dece}
.badge-red{background:#faeae9;color:#c45a52;border:1px solid #e8c5c3}
.badge-gray{background:#f7f8fa;color:#86909c;border:1px solid #e5e6eb}
.badge-yellow{background:#fdf6ec;color:#b8860b;border:1px solid #eddcb0}
.badge-blue{background:#e8eef6;color:#2b5797;border:1px solid #c5d4e8}

/* ── Drawer ─────────────────────────────────────── */
.drawer-overlay{position:fixed;inset:0;z-index:200}
.drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,.3);animation:fadeIn .15s}
.drawer-panel{position:absolute;right:0;top:0;bottom:0;width:520px;background:#fff;box-shadow:-4px 0 16px rgba(0,0,0,.08);display:flex;flex-direction:column;animation:slideIn .2s ease-out}
.drawer-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #e5e6eb;flex-shrink:0}
.drawer-title-text{font-size:15px;font-weight:600;color:#1d2129}
.drawer-close{display:flex;align-items:center;justify-content:center;width:28px;height:28px;background:none;border:none;cursor:pointer;color:#86909c;border-radius:4px;font-size:16px}
.drawer-close:hover{background:#f2f3f5;color:#1d2129}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
.drawer-foot{padding:12px 20px;border-top:1px solid #e5e6eb;display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.facts-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e5e6eb;border-radius:4px;overflow:hidden}
.fact-cell{padding:8px 12px;border-bottom:1px solid #f2f3f5}
.fact-label{font-size:11px;color:#86909c;margin-bottom:2px}
.fact-val{font-size:13px;color:#1d2129;word-break:break-all}
.preview-block{margin-top:16px}
.preview-label{font-size:12px;font-weight:600;color:#1d2129;margin-bottom:6px}
pre.preview{margin:0;padding:10px 12px;background:#fafbfc;border:1px solid #e5e6eb;border-radius:4px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;font-family:Menlo,Consolas,"Courier New",monospace;max-height:200px;overflow-y:auto;color:#1d2129}
.form-field{margin-bottom:14px}
.field-label{font-size:12px;color:#4e5969;margin-bottom:4px;display:flex;align-items:center;gap:2px}
.field-req{color:#c45a52}
.field-input{width:100%;height:32px;padding:0 8px;border:1px solid #e5e6eb;border-radius:4px;outline:none;font-size:13px}
.field-input:focus{border-color:#2b5797}
.field-select{width:100%;height:32px;padding:0 8px;border:1px solid #e5e6eb;border-radius:4px;outline:none;font-size:13px;background:#fff;cursor:pointer}
.field-select:focus{border-color:#2b5797}
.field-textarea{width:100%;padding:8px;border:1px solid #e5e6eb;border-radius:4px;outline:none;font-size:13px;resize:vertical;line-height:1.5}
.field-textarea:focus{border-color:#2b5797}

/* ── Toast ──────────────────────────────────────── */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border:1px solid #e5e6eb;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.1);font-size:13px;color:#1d2129;animation:fadeIn .2s;pointer-events:auto}

/* ── Loading ────────────────────────────────────── */
.loading{padding:32px;text-align:center;color:#86909c;font-size:13px}

/* ── Hidden override ────────────────────────────── */
#pg-login[hidden],#pg-app[hidden]{display:none!important}
</style>
</head>
<body>

<!-- Login -->
<div id="pg-login" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div class="login-title">基础管控中心</div>
      <div class="login-sub">短信监测配置平台</div>
    </div>
    <div class="form-row"><label>用户名</label><input id="inp-un" type="text" placeholder="请输入工号"></div>
    <div class="form-row"><label>密码</label><input id="inp-pw" type="password" placeholder="请输入密码"></div>
    <div id="login-err" class="login-err" hidden></div>
    <button class="btn-login" onclick="doLogin()">登 录</button>
    <div class="login-tip">内网专用 · 未授权访问将被记录</div>
  </div>
</div>

<!-- App -->
<div id="pg-app" class="app-wrap" hidden>
  <header class="topbar">
    <div class="topbar-brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      基础管控中心 · 短信监测配置平台
    </div>
    <div class="topbar-fill"></div>
    <div class="topbar-status" id="svc-status"></div>
    <button class="tbtn tbtn-icon" onclick="refreshPage()" title="刷新">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
    </button>
    <div class="topbar-div"></div>
    <button class="tbtn" onclick="doLogout()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      退出
    </button>
  </header>
  <div class="app-body">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main-area">
      <div class="page-hdr" id="page-hdr"></div>
      <div class="page-body" id="page-body"></div>
    </main>
  </div>
</div>

<!-- Drawer -->
<div class="drawer-overlay" id="drawer" hidden>
  <div class="drawer-bg" onclick="closeDrawer()"></div>
  <div class="drawer-panel">
    <div class="drawer-hdr">
      <span class="drawer-title-text" id="drawer-title">详情</span>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot" id="drawer-foot" hidden>
      <button class="btn btn-default" onclick="closeDrawer()">取消</button>
      <button class="btn btn-primary" onclick="doSave()">保存</button>
    </div>
  </div>
</div>

<!-- Toasts -->
<div class="toast-wrap" id="toasts"></div>

<script>
// ══════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════
const S = {
  curPage: 'overview', curTab: 0,
  search: '', pg: 1, pgSz: 15,
  dMode: '', dData: null, dType: '',
  form: {}, extra: {},  // extra = aux data (e.g. sources list for topic form)
  _tid: 0,
};

// ══════════════════════════════════════════════════
//  API
// ══════════════════════════════════════════════════
async function api(method, path, body) {
  const opts = { method, credentials: 'include' };
  if (body !== undefined) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  if (r.status === 401) { showLogin(); return null; }
  if (r.status === 204) return null;
  const text = await r.text();
  if (!r.ok) throw new Error(text || `HTTP ${r.status}`);
  return text ? JSON.parse(text) : null;
}
const GET  = (p, q) => api('GET', q ? p + '?' + new URLSearchParams(q) : p);
const POST = (p, b) => api('POST', p, b);
const PUT  = (p, b) => api('PUT', p, b);
const DEL  = p       => api('DELETE', p);

// ══════════════════════════════════════════════════
//  Auth
// ══════════════════════════════════════════════════
async function doLogin() {
  const un = document.getElementById('inp-un').value.trim();
  const pw = document.getElementById('inp-pw').value;
  const err = document.getElementById('login-err');
  if (!un || !pw) { err.textContent = '请输入用户名和密码'; err.hidden = false; return; }
  try {
    const r = await POST('/api/auth/login', { username: un, password: pw });
    if (r) { showApp(); }
  } catch(e) { err.textContent = '用户名或密码错误'; err.hidden = false; }
}
async function doLogout() {
  try { await POST('/api/auth/logout'); } catch(_) {}
  showLogin();
}
function showLogin() {
  document.getElementById('pg-login').hidden = false;
  document.getElementById('pg-app').hidden = true;
}
async function showApp() {
  document.getElementById('pg-login').hidden = true;
  document.getElementById('pg-app').hidden = false;
  renderNav();
  await checkHealth();
  navTo('overview');
}
document.getElementById('inp-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
// Auto-check session on load
window.addEventListener('load', async () => {
  try { const r = await GET('/api/auth/me'); if (r) showApp(); } catch(_) {}
});

// ══════════════════════════════════════════════════
//  Health
// ══════════════════════════════════════════════════
async function checkHealth() {
  const wrap = document.getElementById('svc-status');
  try {
    const r = await GET('/health');
    const ok = r?.status === 'ok';
    wrap.innerHTML = `<div class="svc-dot"><div class="dot" style="background:${ok?'#52c41a':'#ff4d4f'}"></div>调度服务</div>
      <div class="svc-dot"><div class="dot" style="background:#52c41a"></div>模板服务</div>
      <div class="svc-dot"><div class="dot" style="background:#faad14"></div>发送服务</div>`;
  } catch(_) {
    wrap.innerHTML = `<div class="svc-dot"><div class="dot" style="background:#ff4d4f"></div>服务异常</div>`;
  }
}

// ══════════════════════════════════════════════════
//  Navigation
// ══════════════════════════════════════════════════
const NAV = [
  { key:'overview',    label:'总览',         icon:'<rect x="3" y="3" width="8" height="8" rx="1" fill="currentColor" stroke="none"/><rect x="13" y="3" width="8" height="8" rx="1" fill="currentColor" stroke="none" opacity=".65"/><rect x="3" y="13" width="8" height="8" rx="1" fill="currentColor" stroke="none" opacity=".65"/><rect x="13" y="13" width="8" height="8" rx="1" fill="currentColor" stroke="none" opacity=".35"/>'},
  { key:'datasource',  label:'数据源管理',   icon:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v5c0 1.66 3.13 3 7 3s7-1.34 7-3V6"/><path d="M5 11v5c0 1.66 3.13 3 7 3s7-1.34 7-3v-5"/>'},
  { key:'topic',       label:'主题管理',      icon:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r=".5" fill="currentColor"/>'},
  { key:'template',    label:'短信模板',      icon:'<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/>'},
  { key:'contact',     label:'联系人管理',    icon:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>'},
  { key:'hitresult',   label:'命中结果',      icon:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'},
  { key:'sendrecord',  label:'发送记录',      icon:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>'},
  { key:'runhistory',  label:'运行历史',      icon:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'},
  { key:'customtask',  label:'自定义任务',    icon:'<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>'},
];

// ══════════════════════════════════════════════════
//  Badge
// ══════════════════════════════════════════════════
const BADGE_MAP = {
  '正常':'green','启用':'green','成功':'green','已处理':'green','active':'green','ok':'green',
  '异常':'red','失败':'red','error':'red','inactive':'red',
  '已停用':'gray','disabled':'gray',
  '未处理':'yellow','待发送':'yellow','pending':'yellow','running':'blue',
  '运行中':'blue','queued':'blue','已发送':'green',
};
function badge(text) {
  if (text === null || text === undefined) return '';
  const t = String(text);
  const cls = BADGE_MAP[t] || 'gray';
  return `<span class="badge badge-${cls}">${t}</span>`;
}
function enabledBadge(v) { return badge(v ? '启用' : '已停用'); }
function statusBadge(s) {
  const m = {running:'运行中',success:'成功',failed:'失败',pending:'待发送',sent:'已发送'};
  return badge(m[s] || s);
}

//  Toast
// ══════════════════════════════════════════════════
function toast(msg, type='success') {
  const id = ++S._tid;
  const ico = type==='success'?'✓':type==='error'?'✕':'!';
  const c = type==='success'?'#3c7d0e':type==='error'?'#c45a52':'#b8860b';
  const el = document.createElement('div');
  el.className = 'toast'; el.id = 'toast-'+id;
  el.innerHTML = `<span style="font-weight:600;color:${c}">${ico}</span>${msg}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function renderPg(total) {

  if (total <= S.pgSz) return '';
  let btns = '';
  for (let i = 1; i <= Math.min(tpg, 7); i++)

  return `<div class="pagination"><span class="pg-info">第 ${S.pg}/${tpg} 页</span>
    <button class="pg-btn" onclick="goPg(${Math.max(1,S.pg-1)})">‹</button>${btns}
    <button class="pg-btn" onclick="goPg(${Math.min(tpg,S.pg+1)})">›</button></div>`;
}

// ══════════════════════════════════════════════════
//  Table helpers
// ══════════════════════════════════════════════════
function tableWrap(cols, rows, acts) {
  const colHtml = cols.map(c=>`<th style="width:${c.w||''}">${c.l}</th>`).join('');
  const actHdr = acts ? `<th style="width:110px">操作</th>` : '';
  let tbody = '';
  if (!rows.length) {
    tbody = `<tr><td colspan="${cols.length + (acts?1:0)}" style="padding:0"><div class="empty-state"><div class="empty-icon">∅</div>暂无数据</div></td></tr>`;
  } else {
    rows.forEach(r => {
      const cells = r.cells.map(c=>`<td>${c??''}</td>`).join('');
      const actCell = acts ? `<td><div class="act-cell">${r.acts.map(a=>`<span class="act-link" style="color:${a.c||'#2b5797'}" onclick="${a.fn}">${a.label}</span>`).join('')}</div></td>` : '';
      tbody += `<tr>${cells}${actCell}</tr>`;
    });
  }
  return `<div class="table-wrap"><table><thead><tr>${colHtml}${actHdr}</tr></thead><tbody>${tbody}</tbody></table></div>`;
}

function fmtDt(s) { return s ? String(s).replace('T',' ').substring(0,16) : '—'; }
function fmtN(n) { return n != null ? Number(n).toLocaleString() : '—'; }
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

    <form id="script-upload-form" onsubmit="return false;">
      <div class="form-field"><div class="field-label">脚本名称<span class="field-req">*</span></div><input class="field-input" name="script_name" required placeholder="例如：警情号码提取"></div>
      <div class="form-field"><div class="field-label">脚本编码<span class="field-req">*</span></div><input class="field-input" name="script_code" required placeholder="例如：jq_number_extract"></div>
      <div class="form-field"><div class="field-label">版本号<span class="field-req">*</span></div><input class="field-input" name="version_no" required placeholder="例如：v1.0"></div>
      <div class="form-field"><div class="field-label">入口文件</div><input class="field-input" name="entry_file" placeholder="例如：jq_number_extract.py (选填)"></div>
      <div class="form-field"><div class="field-label">入口函数</div><input class="field-input" name="entry_func" placeholder="例如：run (默认 run)"></div>
      <div class="form-field"><div class="field-label">变更说明</div><input class="field-input" name="change_log" placeholder="本次版本的修改说明"></div>
      <div class="form-field"><div class="field-label">ZIP 包<span class="field-req">*</span></div><input class="field-input" type="file" name="package" accept=".zip" required></div>
    </form>
  `, true);
}
async function deleteTask(id) {
  if(!window.confirm('确定要删除该自定义任务吗？删除后该任务的调度、规则和运行记录都会一起清除。')) return;
  try{await DEL(`/api/tasks/${id}`);toast('删除成功');loadCustomtask();}catch(e){toast(e.message,'error');}
}
async function runTask(id) {
  try { await POST(`/api/tasks/${id}/run`,{dry_run:false}); toast('任务已触发'); loadCustomtask(); }
  catch(e){toast(e.message,'error');}
}
async function toggleTask(id,enabled) {
  try {
    await POST(`/api/tasks/${id}/${enabled?'enable':'disable'}`);
    toast(enabled?'已启用':'已停用'); loadCustomtask();
  } catch(e){toast(e.message,'error');}
}
window.onScriptChange = function(scriptId) {
  S.form.script_id = Number(scriptId) || 0;
  const script = _scripts.find(s => s.id === S.form.script_id);
  const versions = script?.versions || [];
  const select = document.getElementById('task_script_version_id');
  if (select) {
    select.innerHTML = `<option value="">请选择版本</option>` + versions.map(v => `<option value="${v.id}" ${S.form.script_version_id==v.id?'selected':''}>${v.version_no}</option>`).join('');
    S.form.script_version_id = Number(select.value) || (versions[0]?.id || 0);
  }
}
function renderTaskForm(title) {
  const f=S.form;
  const scriptOpts=_scripts.map(s=>`<option value="${s.id}" ${f.script_id==s.id?'selected':''}>${escapeHtml(s.script_name)} (${escapeHtml(s.script_code)})</option>`).join('');
  const currentScript = _scripts.find(s => s.id === f.script_id) || _scripts[0];
  const versions = currentScript?.versions || [];
  const versionOpts = versions.map(v => `<option value="${v.id}" ${f.script_version_id==v.id?'selected':''}>${escapeHtml(v.version_no)}</option>`).join('');
  openDrawer(title,`
    <div class="form-field"><div class="field-label">任务名称<span class="field-req">*</span></div><input class="field-input" value="${escapeHtml(f.task_name||'')}" oninput="S.form.task_name=this.value"></div>
    <div class="form-field"><div class="field-label">脚本<span class="field-req">*</span></div><select class="field-select" onchange="onScriptChange(this.value)"><option value="">请选择脚本</option>${scriptOpts}</select></div>
    <div class="form-field"><div class="field-label">脚本版本<span class="field-req">*</span></div><select id="task_script_version_id" class="field-select" onchange="S.form.script_version_id=Number(this.value)"><option value="">请选择版本</option>${versionOpts}</select></div>
    <div class="form-field"><div class="field-label">状态</div><select class="field-select" onchange="S.form.enabled=this.value==='true'"><option value="true" ${f.enabled?'selected':''}>启用</option><option value="false" ${!f.enabled?'selected':''}>停用</option></select></div>
    <div class="form-field"><div class="field-label">调度<span class="field-req">*</span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <span style="color:#86909c">每</span>
        <input class="field-input" type="number" min="1" style="flex:1" value="${f.interval_value||1}" oninput="S.form.interval_value=+this.value">
        <select class="field-select" style="flex:1" onchange="S.form.interval_unit=this.value">
          <option value="minute" ${f.interval_unit==='minute'?'selected':''}>分钟</option>
          <option value="hour" ${(f.interval_unit==='hour'||!f.interval_unit)?'selected':''}>小时</option>
        </select>
      </div>
    </div>
    <div class="form-field"><div class="field-label">runtime_config (JSON)</div><textarea class="field-textarea" rows="6" oninput="S.form.runtime_config=this.value">${escapeHtml(f.runtime_config||'{}')}</textarea></div>
  `,true);
}

// ══════════════════════════════════════════════════
//  doSave dispatcher
// ══════════════════════════════════════════════════
async function doSave() {
  const f = S.form;
  try {
    if (S.dMode==='edit-source') {
      let cfg; try{cfg=JSON.parse(f.source_config);}catch(e){toast('source_config JSON格式错误','error');return;}
      await PUT(`/api/theme-sources/${S.dData.id}`,{source_name:f.source_name,source_code:f.source_code,source_type:f.source_type,enabled:f.enabled,source_config:cfg,schedule:{interval_minutes:+f.interval_minutes,enabled:true}});
      toast('保存成功'); closeDrawer(); loadDatasource();
    } else if (S.dMode==='add-source') {
      let cfg; try{cfg=JSON.parse(f.source_config);}catch(e){toast('source_config JSON格式错误','error');return;}
      await POST('/api/theme-sources',{source_name:f.source_name,source_code:f.source_code,source_type:f.source_type,enabled:f.enabled,source_config:cfg,schedule:{interval_minutes:+f.interval_minutes,enabled:true}});
      toast('创建成功'); closeDrawer(); loadDatasource();
    } else if (S.dMode==='edit-topic') {
      let fe; try{fe=JSON.parse(f.filter_expr);}catch(e){toast('filter_expr JSON格式错误','error');return;}
      await PUT(`/api/theme-topics/${S.dData.id}`,{topic_name:f.topic_name,topic_code:f.topic_code,enabled:f.enabled,filter_expr:fe});
      toast('保存成功'); closeDrawer(); loadTopic();
    } else if (S.dMode==='add-topic') {
      if(!f.source_id){toast('请选择数据源','error');return;}
      let fe; try{fe=JSON.parse(f.filter_expr);}catch(e){toast('filter_expr JSON格式错误','error');return;}
      await POST(`/api/theme-sources/${f.source_id}/topics`,{topic_name:f.topic_name,topic_code:f.topic_code,enabled:f.enabled,filter_expr:fe});
      toast('创建成功'); closeDrawer(); loadTopic();
    } else if (S.dMode==='edit-template') {
      await PUT(`/api/message-templates/${S.dData.id}`,{template_name:f.template_name,template_code:f.template_code,template_content:f.template_content,render_example:f.render_example||'',enabled:f.enabled});
      toast('保存成功'); closeDrawer(); loadTemplate();
    } else if (S.dMode==='add-template') {
      await POST('/api/message-templates',{template_name:f.template_name,template_code:f.template_code,template_content:f.template_content,render_example:f.render_example||'',enabled:f.enabled});
      toast('创建成功'); closeDrawer(); loadTemplate();
    } else if (S.dMode==='edit-contact') {
      await PUT(`/api/contacts/${S.dData.id}`,{xm:f.xm,zw:f.zw,sspcs:f.sspcs,sspcsdm:f.sspcsdm,status:f.status});
      toast('保存成功'); closeDrawer(); loadContact();
    } else if (S.dMode==='add-contact') {
      await POST('/api/contacts',{xm:f.xm,zw:f.zw,sspcs:f.sspcs,sspcsdm:f.sspcsdm,status:f.status||'active',phones:[]});
      toast('创建成功'); closeDrawer(); loadContact();
    } else if (S.dMode==='edit-task') {
      let rc; try{rc=JSON.parse(f.runtime_config);}catch(e){toast('runtime_config JSON格式错误','error');return;}
      if(!f.script_id){toast('请选择脚本','error');return;}
      if(!f.script_version_id){toast('请选择脚本版本','error');return;}
      await PUT(`/api/tasks/${S.dData.id}`, {
        task_name: f.task_name,
        script_id: f.script_id,
        script_version_id: f.script_version_id,
        enabled: f.enabled,
        runtime_config: rc
      });
      await PUT(`/api/tasks/${S.dData.id}/schedule`, {interval_value:+f.interval_value||1, interval_unit:f.interval_unit||'hour', enabled:true});
      toast('保存成功'); closeDrawer(); loadCustomtask();
    } else if (S.dMode==='add-task') {
      let rc; try{rc=JSON.parse(f.runtime_config);}catch(e){toast('runtime_config JSON格式错误','error');return;}
      if(!f.script_id){toast('请选择脚本','error');return;}
      if(!f.script_version_id){toast('请选择脚本版本','error');return;}
      await POST('/api/tasks', {
        task_name: f.task_name,
        script_id: f.script_id,
        script_version_id: f.script_version_id,
        enabled: f.enabled,
        runtime_config: rc,
        schedule: {interval_value:+f.interval_value||1, interval_unit:f.interval_unit||'hour', enabled:true}
      });
      toast('创建成功'); closeDrawer(); loadCustomtask();
    } else if (S.dMode==='upload-script') {
      const formEl = document.getElementById('script-upload-form');
      if (!formEl.checkValidity()) {
        formEl.reportValidity();
        return;
      }
      const fd = new FormData(formEl);
      const r = await fetch('/api/scripts/upload', {
        method: 'POST',
        credentials: 'include',
        body: fd
      });
      if (!r.ok) {
        const text = await r.text();
        throw new Error(text || `HTTP ${r.status}`);
      }
      toast('脚本上传成功');
      closeDrawer();
      loadCustomtask();
    }
  } catch(e){toast(e.message,'error');}
}

// ══════════════════════════════════════════════════
//  Load page dispatcher
// ══════════════════════════════════════════════════
async function loadPage() {
  renderPageHdr();
  const loaders = {
    overview: loadOverview, datasource: loadDatasource, topic: loadTopic,
    template: loadTemplate, contact: loadContact, hitresult: loadHitresult,
    sendrecord: loadSendrecord, runhistory: loadRunhistory, customtask: loadCustomtask,
  };
  const fn = loaders[S.curPage];
  if (fn) await fn();
}
</script>
