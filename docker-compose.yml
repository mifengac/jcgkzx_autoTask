services:
  autotask:
    image: ${IMAGE_NAME:-jcgkzx-autotask:offline-20260407_202451}
    pull_policy: never
    container_name: jcgkzx-autotask
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
