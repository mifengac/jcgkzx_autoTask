services:
  autotask:
    image: jcgkzx-autotask:offline-20260311-timefix
    container_name: jcgkzx-autotask
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "${APP_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
